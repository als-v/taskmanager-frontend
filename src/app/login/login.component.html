<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">TM</span>
      <div>
        <p>Task Manager</p>
        <h1 id="login-title">Entrar</h1>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Informe um email valido.</small>

      <label>
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Informe a senha.</small>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <a class="secondary-link" routerLink="/registro">Criar conta</a>
  </section>
</main>
