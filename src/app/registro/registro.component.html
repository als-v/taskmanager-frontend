<main class="login-page">
  <section class="login-panel" aria-labelledby="registro-title">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">TM</span>
      <div>
        <p>Task Manager</p>
        <h1 id="registro-title">Criar conta</h1>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Nome</span>
        <input type="text" formControlName="name" autocomplete="name" />
      </label>
      <small *ngIf="form.controls.name.touched && form.controls.name.invalid">Informe seu nome.</small>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Informe um email valido.</small>

      <label>
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <small *ngIf="form.controls.password.touched && form.controls.password.invalid">A senha deve ter pelo menos 6 caracteres.</small>

      <label>
        <span>Confirmar senha</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </label>
      <small *ngIf="form.controls.confirmPassword.touched && form.errors?.['passwordMismatch']">As senhas nao coincidem.</small>

      <button type="submit" [disabled]="loading()">{{ loading() ? 'Enviando...' : 'Criar conta' }}</button>
    </form>

    <a class="secondary-link" routerLink="/login">Voltar para login</a>
  </section>
</main>
