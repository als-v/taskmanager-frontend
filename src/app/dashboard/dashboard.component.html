<section class="dashboard" aria-labelledby="dashboard-title">
  <header class="dashboard-header">
    <h1 id="dashboard-title">Dashboard</h1>
    <p>Visao geral da operacao. Substitua estes indicadores pelos dados reais da sua API.</p>
  </header>

  <div class="cards">
    <article class="card" *ngFor="let card of cards">
      <span class="card-label">{{ card.titulo }}</span>
      <strong class="card-value">{{ card.valor }}</strong>
      <p class="card-description">{{ card.descricao }}</p>
    </article>
  </div>
</section>
