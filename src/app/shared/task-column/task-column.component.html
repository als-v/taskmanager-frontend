<section class="task-column" [attr.data-status]="status" [attr.aria-label]="title">
  <header class="column-header">
    <div class="column-title">
      <span class="column-dot"></span>
      <strong>{{ title }}</strong>
      <span class="column-count">{{ totalElements() }}</span>
    </div>
    <button class="ghost-button icon-button" type="button" (click)="openCreateModal()" [attr.aria-label]="'Adicionar tarefa em ' + title">+</button>
  </header>

  <div class="column-body" cdkDropList [cdkDropListData]="tasks()" (cdkDropListDropped)="onDrop($event)" (scroll)="onScroll($event)">
    <p class="table-state" *ngIf="loading()">Carregando...</p>

    <ng-container *ngIf="!loading()">
      <app-task-card *ngFor="let task of tasks()" [task]="task" cdkDrag [cdkDragData]="task" (open)="openDetailModal(task)" />
      <p class="table-state" *ngIf="tasks().length === 0">Nenhuma tarefa.</p>
      <p class="load-more-state" *ngIf="loadingMore()">Carregando mais...</p>
    </ng-container>
  </div>

  <app-modal [open]="showCreateModal()" [title]="'Nova tarefa - ' + title" (closed)="closeCreateModal()">
    <form class="task-form" [formGroup]="createForm" (ngSubmit)="submitCreate()">
      <label class="field">
        <span>Titulo</span>
        <input type="text" formControlName="title" maxlength="200" placeholder="Titulo da tarefa" autocomplete="off" />
        <small class="field-error" *ngIf="createForm.get('title')?.touched && createForm.get('title')?.hasError('required')">
          Informe o titulo da tarefa.
        </small>
        <small class="field-error" *ngIf="createForm.get('title')?.hasError('maxlength')">
          O titulo deve ter no maximo 200 caracteres.
        </small>
      </label>

      <label class="field">
        <span>Descricao</span>
        <textarea formControlName="description" maxlength="2000" rows="3" placeholder="Detalhes da tarefa (opcional)"></textarea>
        <small class="field-error" *ngIf="createForm.get('description')?.hasError('maxlength')">
          A descricao deve ter no maximo 2000 caracteres.
        </small>
      </label>

      <label class="field">
        <span>Prioridade</span>
        <select formControlName="priority">
          <option value="LOW">Baixa</option>
          <option value="MEDIUM">Media</option>
          <option value="HIGH">Alta</option>
          <option value="CRITICAL">Critica</option>
        </select>
      </label>

      <label class="field">
        <span>Responsavel</span>
        <select formControlName="assigneeId">
          <option value="">Sem responsavel</option>
          <option *ngFor="let member of members" [value]="member.user_id">{{ member.name }}</option>
        </select>
      </label>

      <label class="field">
        <span>Prazo</span>
        <input type="date" formControlName="dueDate" />
      </label>

      <div class="form-actions">
        <button class="ghost-button" type="button" (click)="closeCreateModal()" [disabled]="creating()">Cancelar</button>
        <button class="primary-button" type="submit" [disabled]="creating()">{{ creating() ? 'Criando...' : 'Criar tarefa' }}</button>
      </div>
    </form>
  </app-modal>

  <app-modal [open]="showDetailModal()" title="Detalhes da tarefa" (closed)="closeDetailModal()">
    <div class="task-detail" *ngIf="selectedTask() as task">
      <div class="task-detail-top">
        <div class="popover" [class.open]="statusMenuOpen()">
          <button
            class="chip-button status-chip"
            type="button"
            [disabled]="savingField() === 'status'"
            aria-haspopup="listbox"
            [attr.aria-expanded]="statusMenuOpen()"
            (click)="toggleStatusMenu()"
          >
            {{ statusLabel(task.status) }}
          </button>

          <div class="popover-menu" role="listbox" *ngIf="statusMenuOpen()">
            <button
              class="popover-option"
              type="button"
              role="option"
              *ngFor="let option of statusOptions"
              [class.selected]="option.value === task.status"
              (click)="selectStatus(option.value)"
            >
              {{ option.label }}
            </button>
          </div>
        </div>

        <span class="field-saving" *ngIf="savingField() === 'status'">Salvando...</span>
      </div>

      <div class="task-detail-title">
        <input
          *ngIf="editingTitle(); else titleText"
          #titleInput
          type="text"
          class="task-title-input"
          maxlength="200"
          [value]="titleDraft()"
          (input)="titleDraft.set(titleInput.value)"
          (blur)="saveTitle()"
          (keydown.enter)="titleInput.blur()"
          (keydown.escape)="cancelEditTitle()"
        />
        <ng-template #titleText>
          <h3 class="task-title-display" tabindex="0" role="button" (click)="startEditTitle()" (keydown.enter)="startEditTitle()">
            {{ task.title }}
          </h3>
        </ng-template>
        <span class="field-saving" *ngIf="savingField() === 'title'">Salvando...</span>
      </div>

      <div class="task-detail-chips">
        <div class="popover" [class.open]="priorityMenuOpen()">
          <button
            [class]="'chip-button priority-chip priority-' + task.priority.toLowerCase()"
            type="button"
            [disabled]="savingField() === 'priority'"
            aria-haspopup="listbox"
            [attr.aria-expanded]="priorityMenuOpen()"
            (click)="togglePriorityMenu()"
          >
            {{ priorityLabels[task.priority] || task.priority }}
          </button>

          <div class="popover-menu" role="listbox" *ngIf="priorityMenuOpen()">
            <button
              class="popover-option"
              type="button"
              role="option"
              *ngFor="let option of priorityOptions"
              [class.selected]="option.value === task.priority"
              (click)="selectPriority(option.value)"
            >
              {{ option.label }}
            </button>
          </div>
        </div>

        <div class="popover" [class.open]="assigneeMenuOpen()">
          <ng-container *ngIf="task.assignee; else joinChip">
            <button
              class="chip-button assignee-chip"
              type="button"
              [disabled]="savingField() === 'assignee'"
              aria-haspopup="listbox"
              [attr.aria-expanded]="assigneeMenuOpen()"
              (click)="toggleAssigneeMenu()"
            >
              <app-avatar [name]="task.assignee.name" size="sm" />
              <span>{{ task.assignee.name }}</span>
            </button>
          </ng-container>
          <ng-template #joinChip>
            <button
              class="chip-button assignee-chip assignee-chip-empty"
              type="button"
              [disabled]="savingField() === 'assignee'"
              (click)="joinTask()"
            >
              + Entrar na task
            </button>
          </ng-template>

          <div class="popover-menu" role="listbox" *ngIf="assigneeMenuOpen()">
            <button class="popover-option" type="button" role="option" (click)="joinTask()">Entrar na task (atribuir a mim)</button>
            <button class="popover-option" type="button" role="option" *ngIf="task.assignee" (click)="selectAssignee(null)">
              Remover responsavel
            </button>
            <button
              class="popover-option"
              type="button"
              role="option"
              *ngFor="let member of members"
              [class.selected]="task.assignee?.id === member.user_id"
              (click)="selectAssignee(member.user_id)"
            >
              {{ member.name }}
            </button>
          </div>
        </div>

        <div class="popover" [class.open]="editingDueDate()">
          <button
            class="chip-button due-date-chip"
            type="button"
            *ngIf="!editingDueDate()"
            [class.due-date-chip-overdue]="isOverdue(task)"
            [disabled]="savingField() === 'dueDate'"
            (click)="startEditDueDate()"
          >
            {{ task.due_date ? ('Prazo: ' + (task.due_date | date: 'dd/MM/yyyy')) : '+ Adicionar prazo' }}
          </button>

          <div class="due-date-editor" *ngIf="editingDueDate()">
            <input #dueDateInput type="date" [value]="dueDateDraft()" (change)="saveDueDate(dueDateInput.value)" />
            <button class="link-button" type="button" *ngIf="task.due_date" (click)="clearDueDate()">Remover</button>
            <button class="link-button" type="button" (click)="cancelEditDueDate()">Cancelar</button>
          </div>
        </div>

        <span class="field-saving" *ngIf="savingField() === 'dueDate'">Salvando...</span>
      </div>

      <div class="task-detail-description">
        <div class="description-header">
          <strong>Descricao</strong>
          <button class="link-button" type="button" *ngIf="!editingDescription()" (click)="startEditDescription()">Editar</button>
        </div>

        <ng-container *ngIf="!editingDescription(); else descriptionEditor">
          <p class="description-text" *ngIf="task.description; else descriptionEmpty">{{ task.description }}</p>
          <ng-template #descriptionEmpty>
            <p class="description-text description-placeholder">Adicionar uma descricao mais detalhada...</p>
          </ng-template>
        </ng-container>

        <ng-template #descriptionEditor>
          <textarea
            #descriptionInput
            class="description-textarea"
            rows="4"
            maxlength="2000"
            [value]="descriptionDraft()"
            (input)="descriptionDraft.set(descriptionInput.value)"
          ></textarea>
          <div class="form-actions">
            <button class="ghost-button" type="button" [disabled]="savingField() === 'description'" (click)="cancelEditDescription()">
              Cancelar
            </button>
            <button class="primary-button" type="button" [disabled]="savingField() === 'description'" (click)="saveDescription()">
              {{ savingField() === 'description' ? 'Salvando...' : 'Salvar' }}
            </button>
          </div>
        </ng-template>
      </div>

      <div class="task-detail-danger">
        <ng-container *ngIf="!confirmingDelete(); else confirmDelete">
          <button class="link-button link-button-danger" type="button" (click)="requestDeleteTask()">Excluir tarefa</button>
        </ng-container>
        <ng-template #confirmDelete>
          <span class="delete-confirm-text">Excluir esta tarefa permanentemente?</span>
          <div class="form-actions">
            <button class="ghost-button" type="button" [disabled]="deletingTask()" (click)="cancelDeleteTask()">Cancelar</button>
            <button class="danger-button" type="button" [disabled]="deletingTask()" (click)="confirmDeleteTask()">
              {{ deletingTask() ? 'Excluindo...' : 'Confirmar exclusao' }}
            </button>
          </div>
        </ng-template>
      </div>
    </div>
  </app-modal>
</section>
