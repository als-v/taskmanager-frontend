<div class="notification-bell" [class.open]="open()">
  <button
    class="bell-button"
    type="button"
    aria-label="Abrir notificacoes"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    <span class="bell-badge" *ngIf="inbox.unreadCount() > 0">{{ inbox.unreadCount() > 9 ? '9+' : inbox.unreadCount() }}</span>
  </button>

  <div class="notification-panel" role="menu" aria-label="Notificacoes" *ngIf="open()">
    <div class="notification-panel-header">
      <strong>Notificacoes</strong>
      <span *ngIf="inbox.unreadCount() > 0">{{ inbox.unreadCount() }} nao lida(s)</span>
    </div>

    <div class="notification-list">
      <p class="notification-empty" *ngIf="!inbox.loading() && inbox.items().length === 0">Nenhuma notificacao nova.</p>

      <button
        class="notification-item"
        type="button"
        role="menuitem"
        *ngFor="let item of inbox.items()"
        (click)="onItemClick(item)"
      >
        <span class="notification-dot" [class.unread]="item.unread"></span>
        <span class="notification-body">
          <strong>{{ typeLabel(item.type) }}</strong>
          <span class="notification-message">{{ item.message }}</span>
          <span class="notification-time">{{ relativeTime(item.created_at) }}</span>
        </span>
      </button>
    </div>
  </div>
</div>
